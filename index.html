<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NCRP | Mafia 2 по сети</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
    <style>
      :root {
        --bg-main: #333343;
        --bg-dark: #2a2a38;
        --field: #3c3c4f;
        --accent: #ffffff;
        --online: #00ff88;
        --white: #ffffff;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Montserrat', sans-serif;
      }

      body {
        background-color: var(--bg-main);
        color: var(--white);
        overflow-x: hidden;
        line-height: 1.4;
      }

      .hero-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background:
          linear-gradient(rgba(51, 51, 67, 0.85), var(--bg-main)),
          url('img/bg5.jpg');
        background-size: cover;
        background-position: center;
      }

      main {
        padding: 0 8%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background: rgba(0, 0, 0, 0.2);
        padding: 10px 18px;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 700;
        margin-bottom: 45px;
        width: fit-content;
        border: 1px solid var(--field);
        letter-spacing: 1px;
      }

      .status-badge span {
        color: var(--online);
        text-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
      }

      .online-indicator {
        position: relative;
        width: 8px;
        height: 8px;
        background-color: var(--online);
        border-radius: 50%;
      }

      .online-indicator::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        background-color: var(--online);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% {
          width: 8px;
          height: 8px;
          opacity: 0.8;
        }
        100% {
          width: 24px;
          height: 24px;
          opacity: 0;
        }
      }

      h1 {
        font-size: clamp(3rem, 12vw, 8rem);
        font-weight: 900;
        line-height: 0.85;
        letter-spacing: -4px;
        margin-bottom: 45px;
        text-transform: uppercase;
      }

      .accent-text {
        color: transparent;
        -webkit-text-stroke: 1px rgba(255, 255, 255, 1);
      }

      .description {
        max-width: 600px;
        margin-bottom: 45px;
      }

      .description p {
        font-size: 1.2rem;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.7);
        line-height: 1.7;
        letter-spacing: 0.5px;
        position: relative;
        padding-left: 25px;
      }

      .description p::before {
        content: '';
        position: absolute;
        left: 0;
        top: 10%;
        height: 80%;
        width: 1px;
        background: linear-gradient(
          to bottom,
          transparent,
          var(--white),
          transparent
        );
        opacity: 0.5;
      }

      .cta-group {
        display: flex;
        gap: 20px;
        align-items: center;
      }

      .btn-main {
        background: var(--white);
        color: var(--bg-main);
        padding: 22px 60px;
        text-decoration: none;
        font-weight: 900;
        font-size: 1rem;
        text-transform: uppercase;
        display: inline-block;
        clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%);
        transition:
          clip-path 0.3s cubic-bezier(0.4, 0, 0.2, 1),
          background 0.3s ease;
      }

      .btn-main:hover {
        background: #f0f0f0;
        clip-path: polygon(15% 0, 100% 0, 85% 100%, 0% 100%);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 30px;
        margin-top: 80px;
        padding-top: 40px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .stat-item h4 {
        font-size: 2rem;
        font-weight: 900;
        color: var(--white);
      }
      .stat-item p {
        font-size: 0.7rem;
        color: var(--accent);
        font-weight: 700;
        text-transform: uppercase;
        opacity: 0.6;
      }

      @media (max-width: 768px) {
        h1 {
          letter-spacing: -2px;
        }
        .cta-group {
          flex-direction: column;
          align-items: flex-start;
        }
        .stats-grid {
          grid-template-columns: 1fr 1fr;
        }

        main {
          padding: 10% 8%;
        }
      }
    </style>
  </head>
  <body>
    <div class="hero-bg"></div>

    <main>
      <div class="status-badge">
        <div class="online-indicator"></div>
        <span>ОНЛАЙН</span
        ><!--  // X PLAYERS -->
      </div>

      <h1>NC<span class="accent-text">RP</span></h1>

      <div class="description">
        <p>
          Легендарный сервер Mafia II, не требующий представления для истинных
          ценителей аутентичной атмосферы.
        </p>
      </div>

      <div class="cta-group">
        <a href="/install" class="btn-main">Установить</a>
      </div>

      <div class="stats-grid">
        <div class="stat-item">
          <h4>RP</h4>
          <p>Режим игры</p>
        </div>
        <div class="stat-item">
          <h4>60+</h4>
          <p>Автомобилей</p>
        </div>
        <div class="stat-item">
          <h4>50+</h4>
          <p>предметов инвентаря</p>
        </div>
        <div class="stat-item">
          <h4>24/7</h4>
          <p>Онлайн</p>
        </div>

        <div class="stat-item">
          <h4>RC6</h4>
          <p>Версия мультиплеера</p>
        </div>
      </div>
    </main>
  </body>
</html>
